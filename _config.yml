# GitHub Pages.
#
# The site is this repository, built from the root: README.md becomes the home
# page (jekyll-readme-index, on by default for Pages), docs/*.md become the
# handbook, and assets/ carries the screenshots. Every link between these files
# is an ordinary relative markdown link, so it works when you read the files on
# github.com *and* on the site — jekyll-relative-links, also on by default,
# rewrites them at build time. Nothing here needs a Gemfile: the theme is one
# GitHub Pages ships.
title: Pineria
description: >-
  Your digital memory, indexed. A local-first archive and digital library
  manager for Windows — no cloud, no account, no telemetry.
theme: jekyll-theme-cayman
url: https://enemyofthescorpion.github.io
baseurl: /pineria

# The "Download .zip / .tar.gz" buttons the theme can add would offer a copy of
# this repository, which is documentation. The download people want is the
# installer, and the README links to it in the first screenful.
show_downloads: false

# GitHub Pages excludes the community health files from a site by default, which
# would 404 the two links the README makes to them. Naming the exclusions here
# replaces that default list; there is no Gemfile or vendor directory in this
# repository for the standard entries to protect against.
exclude:
  - .gitignore

# The handbook pages link back with `[← Back to Pineria](../README.md)`, which is
# the correct link when you are reading the file on github.com. Keeping the
# original README page alongside the generated home page means the same link is
# also correct on the site.
readme_index:
  remove_originals: false
