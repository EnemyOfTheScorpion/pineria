# Documentation rots quietly: a release renames a file, a page moves, an
# external site disappears, and nobody notices until a reader hits a 404. This
# checks every link in the markdown and on the published site — on any pull
# request that touches a document, and once a week for the links that break
# without anybody editing anything.
name: Check links

on:
  pull_request:
    paths:
      - '**/*.md'
      - _config.yml
      - .github/workflows/link-check.yml
  schedule:
    # Mondays, 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every markdown link, and the live site
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # `--no-progress` keeps the log readable; the accepted codes cover the
          # sites that answer a bot with 401/403/429 while serving a person fine.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,401,403,429
            --exclude-path .github
            --exclude '^https://img\.shields\.io'
            --exclude '^https://enemyofthescorpion\.github\.io/pineria/(README|CONTRIBUTING|CODE_OF_CONDUCT)\.md$'
            './**/*.md'
            'https://enemyofthescorpion.github.io/pineria/'
          fail: false
          output: lychee/out.md

      - name: Open an issue when the weekly run finds something
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in the documentation
          content-filepath: lychee/out.md
          labels: documentation, docs-site

      - name: Fail the pull request if it introduced a broken link
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'schedule'
        run: |
          echo "::error::Link check found problems — see the job summary."
          cat lychee/out.md >> "$GITHUB_STEP_SUMMARY"
          exit 1
